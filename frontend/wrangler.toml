name = "codesprint2026"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

send_metrics = false

[observability]
enabled = true

[assets]
directory = "./dist"
# SPA fallback — unknown paths (e.g. a hard refresh on /admin) serve index.html
# with a 200 instead of 404; the client router takes it from there.
not_found_handling = "single-page-application"

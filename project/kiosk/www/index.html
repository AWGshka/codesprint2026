<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0e8c7a" />
    <title>GiveTap Kiosk</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfbfc; font-family: system-ui, sans-serif; }
      main { width: min(420px, 92vw); display: grid; gap: 12px; }
      h1 { font-size: 1.5rem; margin: 0 0 4px; } h1 b { color: #0e8c7a; }
      label { font-size: 0.85rem; color: #6b6b72; display: grid; gap: 4px; }
      input { min-height: 44px; padding: 0 12px; border: 1px solid #cfcfd4; border-radius: 8px; font-size: 1rem; }
      button { min-height: 48px; border: 0; border-radius: 8px; background: #0e8c7a; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- Launcher: stores the server URL + campaign slug, then loads the web kiosk route.
         The Solid kiosk UI itself lives in the main frontend (/kiosk/:slug); this shell only
         provides native packaging + (future) Tap to Pay via src/tap-to-pay.ts. -->
    <main>
      <h1>Give<b>Tap</b> Kiosk</h1>
      <label>Server URL <input id="server" placeholder="https://givetap.example" /></label>
      <label>Campaign slug <input id="slug" placeholder="hope-children" /></label>
      <button id="start">Start kiosk</button>
    </main>
    <script>
      const server = document.getElementById("server");
      const slug = document.getElementById("slug");
      server.value = localStorage.getItem("gt-kiosk-server") ?? "";
      slug.value = localStorage.getItem("gt-kiosk-slug") ?? "";
      document.getElementById("start").addEventListener("click", () => {
        const base = server.value.trim().replace(/\/+$/, "");
        const s = slug.value.trim();
        if (!base || !s) return;
        localStorage.setItem("gt-kiosk-server", base);
        localStorage.setItem("gt-kiosk-slug", s);
        location.href = `${base}/kiosk/${s}`;
      });
    </script>
  </body>
</html>

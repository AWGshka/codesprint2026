name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/backend_key
          chmod 600 ~/.ssh/backend_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend only
        run: |
          # data/ (SQLite) and mastercard/ (key material) live only on the VPS —
          # they are gitignored, so without the excludes --delete would wipe them.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/backend_key -p ${{ secrets.VPS_PORT }}" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude ".git" \
            --exclude "data" \
            --exclude "mastercard" \
            backend/ \
            root@${{ secrets.VPS_HOST }}:/opt/backend/

      - name: Install deps, migrate and restart backend
        run: |
          # Dev deps included: drizzle-kit (db:migrate) is a devDependency.
          ssh -i ~/.ssh/backend_key -p "${{ secrets.VPS_PORT }}" \
            root@${{ secrets.VPS_HOST }} \
            'cd /opt/backend && \
             /root/.bun/bin/bun install --frozen-lockfile && \
             /root/.bun/bin/bun run db:migrate && \
             systemctl restart backend && \
             systemctl status backend --no-pager'
